# ===========================
# Database Configuration
# ===========================
spring.datasource.url=jdbc:mysql://localhost:3306/hospital_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# ===========================
# JPA / Hibernate Configuration
# ===========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===========================
# JWT Configuration
# 256-bit Base64 Encoded Secret Key
# ===========================
app.jwt.secret=SG9zcGl0YWxNYW5hZ2VtZW50U3lzdGVtU2VjcmV0S2V5MjAyNE11c3RCZUF0TGVhc3QyNTZCaXRzTG9uZ0ZvckhNQUNTSEEyNTYh
app.jwt.expiration-ms=86400000

# ===========================
# Server Configuration
# ===========================
server.port=8080

# ===========================
# SQL Initialization
# ===========================
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
