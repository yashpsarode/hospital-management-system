# ===========================
# H2 Embedded Database Profile
# Run with: --spring.profiles.active=h2
# ===========================
spring.datasource.url=jdbc:h2:mem:hospital_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.jwt.secret=SG9zcGl0YWxNYW5hZ2VtZW50U3lzdGVtU2VjcmV0S2V5MjAyNE11c3RCZUF0TGVhc3QyNTZCaXRzTG9uZ0ZvckhNQUNTSEEyNTYh
app.jwt.expiration-ms=86400000

server.port=8080
spring.sql.init.mode=never
